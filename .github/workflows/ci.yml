# Integración continua (SCRUM-344): en cada push o pull request a main
# instala las dependencias del backend y corre los tests unitarios.
# Si un test falla, GitHub marca el commit con una cruz roja.
# El deploy (CD) lo hace el hosting automáticamente al detectar el push a main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maply-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: maply-backend/package-lock.json
      - run: npm ci
      - run: npm test
